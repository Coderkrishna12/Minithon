# Sized for a laptop that also runs an IDE and the backend; the template's 8G heap crashed the daemon.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Kotlin's incremental cache fails when the project and the pub cache are on different Windows
# drives (D:\project vs C:\Users\...\Pub\Cache): relativeTo() throws and the daemon dies.
kotlin.incremental=false
# Compile Kotlin inside the Gradle daemon instead of a second JVM, to save memory.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
